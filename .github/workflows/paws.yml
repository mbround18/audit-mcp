# Generated by `paws workflow generate` — https://github.com/mbround18/paws
name: paws

on:
  push:
    branches: [main]
  pull_request:

jobs:
  paws:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: mbround18/paws/actions/paws-up@main

      - run: paws ci --toolchain rust

  # paws ci covers the default build. These two do not fit its toolchain model
  # and are cheap, so they run alongside rather than inside it.
  features:
    name: feature-gated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The kubernetes and http modules are invisible to a default build, so
      # without this they would rot unnoticed until someone enabled them.
      - run: cargo build --all-features
      - run: cargo clippy --all-features --all-targets -- -D warnings
